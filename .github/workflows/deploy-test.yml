name: Deploy test API

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      contract_public_boundaries:
        description: 'QA-09 public seams (requires contract_load_detail); default off'
        required: true
        type: choice
        options: ['false', 'true']
        default: 'false'
      expected_commit:
        description: Full SHA of current main; must match workflow SHA
        required: true
        type: string
      engine_cpu_diagnosis:
        description: Explicit diagnostic mode for paired runs
        required: true
        type: choice
        options: ['false', 'true']
      authenticated_preconnect:
        description: C0=false / C1=true; requires engine=true; push always false
        required: true
        default: 'false'
        type: choice
        options: ['false', 'true']
      account_read_candidate:
        description: R0=false / R1=true; requires engine/preconnect=true; push always false
        required: true
        default: 'false'
        type: choice
        options: ['false', 'true']
      rollout_phase:
        description: Must match current repository rollout phase
        required: true
        type: choice
        options: [immediate, capacity]
      contract_load_detail:
        description: Default off; both detailed R0/R1 true; requires engine/preconnect; push always false
        required: true
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  contents: read
  id-token: write

concurrency:
  group: fdp-test-app
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy-test
    if: vars.FDP_DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FDP_DEVICE_API_CERTIFICATE_ARN: ${{ vars.FDP_DEVICE_API_CERTIFICATE_ARN }}
      FDP_PUBLIC_API_CERTIFICATE_ARN: ${{ vars.FDP_PUBLIC_API_CERTIFICATE_ARN }}
      FDP_TRUSTSTORE_BUCKET_NAME: ${{ vars.FDP_TRUSTSTORE_BUCKET_NAME }}
      FDP_TRUSTSTORE_VERSION: ${{ vars.FDP_TRUSTSTORE_VERSION }}
      FDP_QA09_ENGINE_CPU_DIAGNOSIS: ${{ vars.FDP_QA09_ENGINE_CPU_DIAGNOSIS || ((vars.FDP_QA09_ROLLOUT_PHASE == 'capacity' || vars.FDP_QA09_ROLLOUT_PHASE == 'immediate') && 'true' || 'false') }}
      FDP_QA09_ROLLOUT_PHASE: ${{ vars.FDP_QA09_ROLLOUT_PHASE || 'baseline' }}
      FDP_TEST_DEPLOY_ROLE_ARN: ${{ vars.FDP_TEST_DEPLOY_ROLE_ARN }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 10.20.0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Resolve and record exact deployment inputs
        env:
          QA09_EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          QA09_REQUESTED_ACCOUNT_READ: ${{ inputs.account_read_candidate }}
          QA09_REQUESTED_CONTRACT_DETAIL: ${{ inputs.contract_load_detail }}
          QA09_REQUESTED_CONTRACT_PUBLIC: ${{ inputs.contract_public_boundaries }}
          QA09_REQUESTED_PRECONNECT: ${{ inputs.authenticated_preconnect }}
          QA09_REQUESTED_ENGINE: ${{ inputs.engine_cpu_diagnosis }}
          QA09_REQUESTED_PHASE: ${{ inputs.rollout_phase }}
        run: node scripts/record-qa09-deployment-inputs.mjs qa09-deployment-inputs.json
      - uses: actions/upload-artifact@v7
        with:
          name: qa09-deployment-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: qa09-deployment-inputs.json
          if-no-files-found: error
          retention-days: 30
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm verify
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.FDP_TEST_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1
          allowed-account-ids: '065986019555'
          role-session-name: fdp-test-${{ github.run_id }}
      - name: Verify target account and exact commit
        run: |
          test "$(aws sts get-caller-identity --query Account --output text)" = '065986019555'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - run: node scripts/esgiot-cdk.mjs diff AppDependencies
      - run: node scripts/esgiot-cdk.mjs deploy AppDependencies
